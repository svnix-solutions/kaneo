# Fork-only (svnix-solutions/kaneo): build the single-container Kaneo image
# with the Candidates module and push it to GHCR.
#   push to fn/main  -> ghcr.io/svnix-solutions/kaneo:fn-main, :fn-<sha>
#   tag fn-v*        -> ghcr.io/svnix-solutions/kaneo:<tag without "fn-v">
name: fn-image

on:
  push:
    branches: [fn/main]
    tags: ["fn-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fn-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kaneo
          tags: |
            type=raw,value=fn-main,enable=${{ github.ref == 'refs/heads/fn/main' }}
            type=sha,prefix=fn-,format=short
            type=match,pattern=fn-v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
